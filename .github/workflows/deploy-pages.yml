name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test official source parsers
        run: npm run test:access-data
      - name: Refresh official daily access data without browser
        id: direct-refresh
        continue-on-error: true
        run: npm run refresh:daily-access
      - name: Install browser after an official anti-bot challenge
        if: steps.direct-refresh.outcome == 'failure'
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Retry official daily access refresh with browser fallback
        if: steps.direct-refresh.outcome == 'failure'
        run: npm run refresh:daily-access
      - name: Validate daily snapshot
        run: npm run validate:daily-access
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
